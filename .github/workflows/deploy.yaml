name: Deploy wyhblog
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Build binary
        run: |
          cd cmd/server
          CGO_ENABLED=0 GOOS=linux go build -a -installsuffix cgo -o ../../wyhblog .
          ls -la ../../wyhblog

      - name: Upload binary
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "wyhblog"
          target: "/tmp/"
          overwrite: true

      - name: Run on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            echo "=== 开始部署 ==="

            # 创建目录
            DEPLOY_DIR="/opt/wyhblog"
            mkdir -p $DEPLOY_DIR/logs
            mkdir -p $DEPLOY_DIR/data/posts
            mkdir -p $DEPLOY_DIR/web/dist

            # 检查文件
            echo "检查上传的文件:"
            ls -la /tmp/wyhblog

            # 停止旧进程（更精确的方式）
            echo "停止旧进程..."
            # 只杀死 /opt/wyhblog/wyhblog 进程，不杀其他
            ps aux | grep "/opt/wyhblog/wyhblog" | grep -v grep | awk '{print $2}' | xargs -r kill -9
            screen -X -S wyhblog quit 2>/dev/null || true
            sleep 2

            # 安装新版本
            echo "安装新版本..."
            cp /tmp/wyhblog $DEPLOY_DIR/
            chmod +x $DEPLOY_DIR/wyhblog

            # 启动程序（使用完整路径）
            echo "启动程序..."
            cd $DEPLOY_DIR
            
            # 使用 nohup 启动（最可靠）
            nohup $DEPLOY_DIR/wyhblog > $DEPLOY_DIR/logs/wyhblog.log 2>&1 &

            # 等待启动
            sleep 3

            # 验证进程（只检查特定路径的进程）
            if pgrep -f "$DEPLOY_DIR/wyhblog" >/dev/null; then
              PID=$(pgrep -f "$DEPLOY_DIR/wyhblog")
              echo "✅ 启动成功！PID: $PID"
              
              # 检查端口
              sleep 2
              if netstat -tlnp 2>/dev/null | grep ":8080" | grep -q "$PID"; then
                echo "✅ 服务已监听 8080 端口"
              else
                echo "⚠️ 端口未监听，查看日志:"
                tail -20 $DEPLOY_DIR/logs/wyhblog.log
              fi
            else
              echo "❌ 启动失败！"
              echo "日志:"
              tail -50 $DEPLOY_DIR/logs/wyhblog.log
              exit 1
            fi

            echo "=== 部署完成 ==="
