name: Deploy wyhblog
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. 设置Go
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      # 3. 编译
      - name: Build binary
        run: |
          echo "当前目录: $(pwd)"
          cd cmd/server
          go build -o ../../wyhblog .
          echo "编译完成，检查文件:"
          ls -la ../../wyhblog
          file ../../wyhblog

      # 4. 测试SSH连接
      - name: Test SSH connection
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            echo "✅ SSH连接成功"
            echo "服务器时间: $(date)"
            echo "当前用户: $(whoami)"

      # 5. 上传文件
      - name: Upload binary
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "wyhblog"
          target: "/tmp/"
          overwrite: true

      # 6. 部署运行（简化版，使用screen）
      - name: Run on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            echo "=== 开始部署 ==="
            
            # 创建目录
            DEPLOY_DIR="/opt/wyhblog"
            mkdir -p $DEPLOY_DIR/logs
            mkdir -p $DEPLOY_DIR/data/posts
            mkdir -p $DEPLOY_DIR/web/dist
            
            # 检查文件
            echo "检查上传的文件:"
            ls -la /tmp/wyhblog
            
            # 停止旧进程
            echo "停止旧进程..."
            pkill -f wyhblog 2>/dev/null || true
            screen -X -S wyhblog quit 2>/dev/null || true
            sleep 2
            
            # 安装新版本
            echo "安装新版本..."
            mv /tmp/wyhblog $DEPLOY_DIR/
            chmod +x $DEPLOY_DIR/wyhblog
            
            # 启动程序
            echo "启动程序..."
            cd $DEPLOY_DIR
            
            # 使用 screen 运行
            screen -dmS wyhblog bash -c "cd $DEPLOY_DIR && ./wyhblog > logs/wyhblog.log 2>&1"
            
            # 验证
            sleep 3
            if pgrep -f wyhblog >/dev/null; then
              PID=$(pgrep -f wyhblog)
              echo "✅ 启动成功！PID: $PID"
              echo "查看日志: tail -f $DEPLOY_DIR/logs/wyhblog.log"
            else
              echo "❌ 启动失败！"
              echo "日志:"
              tail -20 $DEPLOY_DIR/logs/wyhblog.log 2>/dev/null || echo "无日志"
              exit 1
            fi
            
            echo "=== 部署完成 ==="
