name: Deploy wyhblog
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. 设置Go
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      # 3. 编译
      - name: Build binary
        run: |
          echo "当前目录: $(pwd)"
          cd cmd/server
          go build -o ../../wyhblog .
          ls -la ../../wyhblog

      # 4. 测试SSH连接
      - name: Test SSH connection
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            echo "✅ SSH连接成功"
            echo "服务器时间: $(date)"

      # 5. 上传文件
      - name: Upload binary
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "wyhblog"
          target: "/tmp/"
          overwrite: true

      # 6. 部署运行（使用 systemd）
      - name: Run on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            echo "=== 开始部署 ==="

            # 1. 检查文件
            echo "检查上传的文件:"
            ls -la /tmp/wyhblog
            file /tmp/wyhblog

            # 2. 创建目录
            DEPLOY_DIR="/opt/wyhblog"
            sudo mkdir -p $DEPLOY_DIR/logs
            sudo mkdir -p $DEPLOY_DIR/data/posts
            sudo mkdir -p $DEPLOY_DIR/web/dist

            # 3. 停止服务
            echo "停止服务..."
            sudo systemctl stop wyhblog 2>/dev/null || echo "服务未运行"

            # 4. 备份旧版本
            if [ -f "$DEPLOY_DIR/wyhblog" ]; then
              echo "备份旧版本..."
              sudo cp $DEPLOY_DIR/wyhblog $DEPLOY_DIR/wyhblog.backup.$(date +%Y%m%d_%H%M%S)
            fi

            # 5. 安装新版本
            echo "安装新版本..."
            sudo mv /tmp/wyhblog $DEPLOY_DIR/
            sudo chmod +x $DEPLOY_DIR/wyhblog
            sudo chown -R root:root $DEPLOY_DIR

            # 6. 创建/更新服务文件
            echo "更新服务配置..."
            sudo tee /etc/systemd/system/wyhblog.service > /dev/null << 'EOF'
            [Unit]
            Description=wyhblog Service
            After=network.target

            [Service]
            Type=simple
            User=root
            WorkingDirectory=/opt/wyhblog
            Environment="DATA_DIR=/opt/wyhblog/data/posts"
            Environment="PUBLIC_DIR=/opt/wyhblog/web/dist"
            Environment="ADMIN_USER=admin"
            Environment="ADMIN_PASS=admin123"
            ExecStart=/opt/wyhblog/wyhblog
            Restart=always
            RestartSec=10
            StandardOutput=append:/opt/wyhblog/logs/wyhblog.log
            StandardError=append:/opt/wyhblog/logs/wyhblog.log

            [Install]
            WantedBy=multi-user.target
            EOF

            # 7. 重新加载 systemd
            echo "重新加载 systemd..."
            sudo systemctl daemon-reload

            # 8. 启动服务
            echo "启动服务..."
            sudo systemctl enable wyhblog
            sudo systemctl start wyhblog

            # 9. 检查服务状态
            echo "检查服务状态..."
            sleep 3
            
            # 10. 验证
            if sudo systemctl is-active --quiet wyhblog; then
              echo "✅ 服务启动成功！"
              echo "服务状态:"
              sudo systemctl status wyhblog --no-pager
              echo ""
              echo "查看日志: sudo journalctl -u wyhblog -f"
              echo "或: tail -f /opt/wyhblog/logs/wyhblog.log"
            else
              echo "❌ 服务启动失败！"
              echo "服务状态:"
              sudo systemctl status wyhblog --no-pager
              echo ""
              echo "查看日志: sudo journalctl -u wyhblog -n 50 --no-pager"
              exit 1
            fi

            echo "=== 部署完成 ==="
