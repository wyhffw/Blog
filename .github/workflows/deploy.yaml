name: Deploy wyhblog
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. 设置Go
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      # 3. 编译（静态编译，兼容旧版Linux）
      - name: Build binary
        run: |
          echo "当前目录: $(pwd)"
          cd cmd/server
          echo "使用静态编译..."
          CGO_ENABLED=0 GOOS=linux go build -a -installsuffix cgo -o ../../wyhblog .
          echo "编译完成，检查文件:"
          ls -la ../../wyhblog
          file ../../wyhblog
          # 检查是否静态编译
          ldd ../../wyhblog 2>&1 | grep "not a dynamic executable" && echo "✅ 静态编译成功" || echo "⚠️ 警告：可能是动态编译"

      # 4. 测试SSH连接
      - name: Test SSH connection
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            echo "✅ SSH连接成功"
            echo "服务器时间: $(date)"
            echo "当前用户: $(whoami)"
            echo "系统信息: $(cat /etc/os-release | grep PRETTY_NAME)"

      # 5. 上传文件
      - name: Upload binary
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "wyhblog"
          target: "/tmp/"
          overwrite: true

      # 6. 部署运行
      - name: Run on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            echo "=== 开始部署 ==="
            
            # 创建目录
            DEPLOY_DIR="/opt/wyhblog"
            mkdir -p $DEPLOY_DIR/logs
            mkdir -p $DEPLOY_DIR/data/posts
            mkdir -p $DEPLOY_DIR/web/dist
            
            # 检查上传的文件
            echo "检查上传的文件:"
            ls -la /tmp/wyhblog
            file /tmp/wyhblog
            
            # 停止旧进程
            echo "停止旧进程..."
            pkill -f wyhblog 2>/dev/null || true
            screen -X -S wyhblog quit 2>/dev/null || true
            sleep 2
            
            # 清理旧文件（保留data和logs）
            echo "清理旧文件..."
            cd $DEPLOY_DIR
            rm -f wyhblog wyhblog-backup-* 2>/dev/null || true
            
            # 安装新版本
            echo "安装新版本..."
            cp /tmp/wyhblog $DEPLOY_DIR/
            chmod +x $DEPLOY_DIR/wyhblog
            
            # 检查是否静态编译（可选）
            echo "检查编译方式:"
            ldd $DEPLOY_DIR/wyhblog 2>&1 | head -3 || echo "✅ 静态编译程序"
            
            # 启动程序
            echo "启动程序..."
            cd $DEPLOY_DIR
            
            # 使用 screen 运行
            screen -dmS wyhblog bash -c "cd $DEPLOY_DIR && ./wyhblog > logs/wyhblog.log 2>&1"
            
            # 验证
            sleep 3
            if pgrep -f wyhblog >/dev/null; then
              PID=$(pgrep -f wyhblog)
              echo "✅ 启动成功！PID: $PID"
              echo "查看日志: tail -f $DEPLOY_DIR/logs/wyhblog.log"
              
              # 检查端口
              sleep 2
              if netstat -tlnp 2>/dev/null | grep -q ":8080"; then
                echo "✅ 服务已监听 8080 端口"
              else
                echo "⚠️ 等待端口监听..."
                sleep 3
                netstat -tlnp | grep 8080 || echo "端口未监听，请检查日志"
              fi
            else
              echo "❌ 启动失败！"
              echo "日志:"
              tail -20 $DEPLOY_DIR/logs/wyhblog.log 2>/dev/null || echo "无日志"
              exit 1
            fi
            
            echo "=== 部署完成 ==="
