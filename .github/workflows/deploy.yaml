name: Deploy wyhblog
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Build binary
        run: |
          cd cmd/server
          CGO_ENABLED=0 GOOS=linux go build -a -installsuffix cgo -o ../../wyhblog .
          ls -la ../../wyhblog

      # 打包web/dist目录的内容（不包含web目录本身）
      - name: Package web files
        run: |
          echo "打包web/dist文件..."
          cd web/dist
          tar -czf ../../web.tar.gz .
          cd ../..
          echo "打包完成:"
          ls -la web.tar.gz

      # 上传程序文件
      - name: Upload binary
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "wyhblog"
          target: "/tmp/"
          overwrite: true

      # 上传web文件
      - name: Upload web files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "web.tar.gz"
          target: "/tmp/"
          overwrite: true

      - name: Run on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            echo "=== 开始全量部署 ==="

            DEPLOY_DIR="/opt/wyhblog"
            
            # 创建基础目录
            mkdir -p $DEPLOY_DIR/logs
            mkdir -p $DEPLOY_DIR/data/posts
            mkdir -p $DEPLOY_DIR/web/dist
            
            # 检查上传的文件
            echo "检查上传的文件:"
            ls -la /tmp/wyhblog
            ls -la /tmp/web.tar.gz

            # 停止旧进程
            echo "停止旧进程..."
            ps aux | grep "/opt/wyhblog/wyhblog" | grep -v grep | awk '{print $2}' | xargs -r kill -9
            screen -X -S wyhblog quit 2>/dev/null || true
            sleep 2

            # 更新web文件
            echo "更新web文件..."
            if [ -f /tmp/web.tar.gz ]; then
              # 备份当前的web/dist目录
              if [ -d "$DEPLOY_DIR/web/dist" ]; then
                echo "备份当前web/dist目录..."
                cp -r $DEPLOY_DIR/web/dist $DEPLOY_DIR/web/dist.backup.$(date +%Y%m%d-%H%M%S) 2>/dev/null || true
              fi
              
              # 清空web/dist目录
              rm -rf $DEPLOY_DIR/web/dist/*
              
              # 解压新的web文件到web/dist目录
              echo "解压web文件到 $DEPLOY_DIR/web/dist/"
              tar -xzf /tmp/web.tar.gz -C $DEPLOY_DIR/web/dist/
              
              echo "web文件更新完成:"
              ls -la $DEPLOY_DIR/web/dist/
            else
              echo "⚠️ web.tar.gz 文件不存在，跳过web更新"
            fi

            # 更新程序文件
            echo "更新程序文件..."
            if [ -f /tmp/wyhblog ]; then
              # 备份当前程序
              if [ -f "$DEPLOY_DIR/wyhblog" ]; then
                cp $DEPLOY_DIR/wyhblog $DEPLOY_DIR/wyhblog.backup.$(date +%Y%m%d-%H%M%S)
              fi
              
              # 复制新程序
              cp /tmp/wyhblog $DEPLOY_DIR/
              chmod +x $DEPLOY_DIR/wyhblog
              echo "程序文件更新完成"
            else
              echo "❌ wyhblog 文件不存在！"
              exit 1
            fi

            # 启动程序
            echo "启动程序..."
            cd $DEPLOY_DIR
            nohup $DEPLOY_DIR/wyhblog > $DEPLOY_DIR/logs/wyhblog.log 2>&1 &

            # 等待启动
            sleep 3

            # 验证进程
            if pgrep -f "$DEPLOY_DIR/wyhblog" >/dev/null; then
              PID=$(pgrep -f "$DEPLOY_DIR/wyhblog")
              echo "✅ 启动成功！PID: $PID"
              
              # 检查端口
              sleep 2
              if netstat -tlnp 2>/dev/null | grep ":8080" | grep -q "$PID"; then
                echo "✅ 服务已监听 8080 端口"
              else
                echo "⚠️ 端口未监听，查看日志:"
                tail -20 $DEPLOY_DIR/logs/wyhblog.log
              fi
            else
              echo "❌ 启动失败！"
              echo "日志:"
              tail -50 $DEPLOY_DIR/logs/wyhblog.log
              exit 1
            fi

            # 清理临时文件
            rm -f /tmp/web.tar.gz
            echo "临时文件已清理"

            echo "=== 部署完成 ==="
            echo "web文件位置: $DEPLOY_DIR/web/dist/"
            ls -la $DEPLOY_DIR/web/dist/
            echo "程序文件: $DEPLOY_DIR/wyhblog"
            echo "日志文件: $DEPLOY_DIR/logs/wyhblog.log"
