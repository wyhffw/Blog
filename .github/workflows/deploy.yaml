name: Deploy wyhblog
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. 设置Go
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      # 3. 编译
      - name: Build binary
        run: |
          echo "当前目录: $(pwd)"
          echo "编译目录: $(pwd)/cmd/server"
          cd cmd/server
          go build -o ../../wyhblog .
          echo "编译完成，检查文件:"
          ls -la ../../wyhblog
          file ../../wyhblog
          
      # 4. 确认文件存在并显示路径
      - name: Verify binary
        run: |
          echo "检查根目录下的 wyhblog 文件:"
          pwd
          ls -la wyhblog
          echo "文件大小: $(wc -c < wyhblog) bytes"

      # 5. 测试SSH连接
      - name: Test SSH connection
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            echo "✅ SSH连接成功"
            echo "服务器时间: $(date)"
            echo "当前用户: $(whoami)"
            echo "主目录: $HOME"

      # 6. 上传文件（关键修复：使用正确的源路径）
      - name: Upload binary
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "wyhblog"  # 这里指定要上传的文件
          target: "/tmp/"
          strip_components: 0
          overwrite: true
          debug: true  # 开启调试模式

      # 7. 部署运行（增强错误处理）
      - name: Run on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e  # 遇到错误立即退出
            echo "=== 开始部署 ==="
            
            # 0. 检查文件是否上传成功
            echo "检查上传的文件:"
            ls -la /tmp/wyhblog || { echo "❌ 文件未找到!"; exit 1; }
            file /tmp/wyhblog
            
            # 1. 创建目录
            DEPLOY_DIR="/opt/wyhblog"
            echo "创建目录: $DEPLOY_DIR"
            sudo mkdir -p $DEPLOY_DIR/logs
            sudo chown $USER:$USER $DEPLOY_DIR -R
            
            # 2. 停止旧进程
            echo "停止旧进程..."
            pkill -f wyhblog 2>/dev/null || echo "没有正在运行的进程"
            sleep 2
            
            # 3. 备份旧版本
            if [ -f "$DEPLOY_DIR/wyhblog" ]; then
              echo "备份旧版本..."
              cp $DEPLOY_DIR/wyhblog $DEPLOY_DIR/wyhblog.backup.$(date +%Y%m%d_%H%M%S)
            fi
            
            # 4. 移动并设置权限
            echo "安装新版本..."
            mv /tmp/wyhblog $DEPLOY_DIR/
            chmod +x $DEPLOY_DIR/wyhblog
            
            # 5. 设置环境变量（可选，根据需要修改）
            echo "设置环境变量..."
            export DATA_DIR="$DEPLOY_DIR/data/posts"
            export PUBLIC_DIR="$DEPLOY_DIR/web/dist"
            export ADMIN_USER="admin"
            export ADMIN_PASS="admin123"  # 建议从secrets获取
            
            # 6. 创建必要的目录
            mkdir -p $DEPLOY_DIR/data/posts
            mkdir -p $DEPLOY_DIR/web/dist
            
            # 7. 启动程序
            echo "启动程序..."
            cd $DEPLOY_DIR
            
            # 确保没有残留进程
            pkill -f wyhblog 2>/dev/null || true
            sleep 2
            
            # 启动并记录日志
            nohup ./wyhblog > logs/wyhblog.log 2>&1 &
            
            # 8. 验证启动
            echo "验证启动..."
            sleep 5
            
            # 检查进程
            PID=$(pgrep -f wyhblog)
            if [ -n "$PID" ]; then
              echo "✅ 启动成功！PID: $PID"
              
              # 检查端口
              sleep 2
              if netstat -tlnp 2>/dev/null | grep -q ":8080"; then
                echo "✅ 服务已监听 8080 端口"
              else
                echo "⚠️ 警告: 可能没有监听 8080 端口"
                echo "检查日志:"
                tail -20 logs/wyhblog.log
              fi
              
              echo "查看日志: tail -f $DEPLOY_DIR/logs/wyhblog.log"
            else
              echo "❌ 启动失败！"
              echo "查看日志:"
              tail -20 logs/wyhblog.log
              exit 1
            fi
            
            echo "=== 部署完成 ==="
