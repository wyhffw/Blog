<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>墨言 · 思想碎片</title>
    
    <!-- 字体和图标 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Markdown 渲染库 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- 代码高亮 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    
    <style>
        /* ===== 设计系统 ===== */
        :root {
            /* 颜色 - 暖色调 */
            --bg: #fcf9f7;
            --surface: #ffffff;
            --text: #2c2c2c;
            --text-soft: #4b4b4b;
            --text-muted: #767676;
            --border-light: #eae2d9;
            --border: #ddd0c4;
            --accent: #b45f4b;
            --accent-light: #f0e7e4;
            --accent-dark: #8e4c3c;
            --selection: #f4ece8;
            
            /* 排版 */
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-serif: 'Lora', Georgia, 'Times New Roman', serif;
            
            /* 尺寸 */
            --radius: 16px;
            --radius-sm: 8px;
            --max-width: 760px;
            --header-height: 80px;
            
            /* 效果 */
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow: 0 10px 30px -15px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 20px 40px -20px rgba(0, 0, 0, 0.2);
            --transition: all 0.2s ease;
        }
        
        /* 深色模式 - 暖调深色 */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1f1b19;
                --surface: #2a2522;
                --text: #e8e0d9;
                --text-soft: #c9bcb2;
                --text-muted: #9b8f85;
                --border-light: #3d3530;
                --border: #554b44;
                --accent: #d68b7a;
                --accent-light: #3d312c;
                --accent-dark: #b16e5e;
                --selection: #3d332e;
            }
        }
        
        /* ===== 基础重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: background-color 0.3s, color 0.3s;
        }
        
        /* ===== 布局 ===== */
        .site-wrapper {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 24px;
            width: 100%;
        }
        
        /* ===== 导航栏 ===== */
        .site-header {
            height: var(--header-height);
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border-light);
            background: var(--surface);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            background: rgba(var(--surface-rgb), 0.8);
        }
        
        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        
        .logo {
            font-size: 24px;
            font-weight: 500;
            text-decoration: none;
            color: var(--text);
            letter-spacing: -0.02em;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .logo:hover {
            color: var(--accent);
        }
        
        .logo span {
            font-family: var(--font-serif);
            font-size: 20px;
            font-weight: 400;
            color: var(--text-muted);
            font-style: italic;
        }
        
        .nav-links {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        
        .nav-btn {
            background: none;
            border: none;
            color: var(--text-soft);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 40px;
            transition: var(--transition);
            font-family: var(--font-sans);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        
        .nav-btn i {
            font-size: 14px;
        }
        
        .nav-btn:hover {
            color: var(--text);
            background: var(--selection);
        }
        
        .nav-btn.primary {
            background: var(--accent);
            color: white;
        }
        
        .nav-btn.primary:hover {
            background: var(--accent-dark);
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }
        
        /* ===== 文章列表 ===== */
        .posts-list {
            display: flex;
            flex-direction: column;
            gap: 48px;
            padding: 48px 0;
        }
        
        .post-item {
            cursor: pointer;
            transition: var(--transition);
            border-bottom: 1px solid var(--border-light);
            padding-bottom: 48px;
            position: relative;
        }
        
        .post-item:hover {
            transform: translateX(4px);
        }
        
        .post-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }
        
        .post-meta {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 16px;
            font-size: 13px;
            color: var(--text-muted);
            letter-spacing: 0.3px;
        }
        
        .post-date {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .post-category {
            background: var(--selection);
            padding: 4px 12px;
            border-radius: 40px;
            color: var(--text-soft);
            font-size: 12px;
            font-weight: 500;
        }
        
        .post-title {
            font-family: var(--font-serif);
            font-size: 38px;
            font-weight: 500;
            line-height: 1.2;
            margin-bottom: 20px;
            letter-spacing: -0.01em;
            color: var(--text);
            transition: var(--transition);
        }
        
        .post-item:hover .post-title {
            color: var(--accent);
        }
        
        .post-excerpt {
            color: var(--text-soft);
            font-size: 17px;
            line-height: 1.7;
            margin-bottom: 24px;
            font-family: var(--font-serif);
        }
        
        .read-more {
            font-size: 15px;
            color: var(--accent);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            transition: var(--transition);
            border-bottom: 1px solid transparent;
        }
        
        .read-more i {
            font-size: 12px;
            transition: transform 0.2s;
        }
        
        .read-more:hover {
            gap: 12px;
            border-bottom-color: var(--accent);
        }
        
        /* ===== 文章详情页 ===== */
        .post-detail {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 48px 0;
        }
        
        .post-detail-header {
            margin-bottom: 48px;
            text-align: center;
        }
        
        .post-detail-title {
            font-family: var(--font-serif);
            font-size: 56px;
            font-weight: 500;
            line-height: 1.1;
            margin: 24px 0 32px;
            letter-spacing: -0.02em;
        }
        
        .post-detail-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-muted);
            font-size: 15px;
            padding: 24px 0;
            border-top: 1px solid var(--border-light);
            border-bottom: 1px solid var(--border-light);
            max-width: 600px;
            margin: 0 auto;
        }
        
        .post-detail-content {
            font-size: 18px;
            line-height: 1.9;
            color: var(--text);
            margin-top: 56px;
            font-family: var(--font-serif);
        }
        
        /* Markdown 样式优化 */
        .post-detail-content h1,
        .post-detail-content h2,
        .post-detail-content h3,
        .post-detail-content h4 {
            font-family: var(--font-sans);
            font-weight: 500;
            letter-spacing: -0.01em;
            margin-top: 2.5em;
            margin-bottom: 1em;
        }
        
        .post-detail-content h1 {
            font-size: 40px;
        }
        
        .post-detail-content h2 {
            font-size: 32px;
        }
        
        .post-detail-content h3 {
            font-size: 26px;
        }
        
        .post-detail-content h4 {
            font-size: 22px;
        }
        
        .post-detail-content p {
            margin-bottom: 1.8em;
        }
        
        .post-detail-content code {
            font-family: 'JetBrains Mono', 'SF Mono', monospace;
            font-size: 0.9em;
            background: var(--selection);
            padding: 0.2em 0.4em;
            border-radius: 4px;
            border: 1px solid var(--border-light);
        }
        
        .post-detail-content pre {
            background: var(--surface);
            border: 1px solid var(--border-light);
            border-radius: var(--radius);
            padding: 24px;
            overflow-x: auto;
            margin: 40px 0;
            box-shadow: var(--shadow-sm);
        }
        
        .post-detail-content pre code {
            background: none;
            border: none;
            padding: 0;
            font-size: 15px;
            line-height: 1.7;
            color: var(--text);
        }
        
        .post-detail-content blockquote {
            margin: 48px 0;
            padding: 24px 32px;
            border-left: 4px solid var(--accent);
            background: var(--selection);
            font-style: italic;
            border-radius: 0 var(--radius) var(--radius) 0;
            font-size: 1.1em;
            color: var(--text-soft);
        }
        
        .post-detail-content blockquote p:last-child {
            margin-bottom: 0;
        }
        
        .post-detail-content ul,
        .post-detail-content ol {
            margin: 32px 0;
            padding-left: 28px;
        }
        
        .post-detail-content li {
            margin-bottom: 8px;
        }
        
        .post-detail-content img {
            max-width: 100%;
            border-radius: var(--radius);
            margin: 48px 0;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-lg);
        }
        
        .post-detail-content hr {
            margin: 56px 0;
            border: none;
            border-top: 1px solid var(--border-light);
        }
        
        /* ===== 空状态 ===== */
        .empty-state {
            text-align: center;
            padding: 80px 0 120px;
        }
        
        .empty-icon {
            font-size: 64px;
            color: var(--border);
            margin-bottom: 24px;
            opacity: 0.5;
        }
        
        .empty-state h2 {
            font-size: 24px;
            font-weight: 400;
            color: var(--text-soft);
            margin-bottom: 12px;
            font-family: var(--font-serif);
        }
        
        .empty-state p {
            color: var(--text-muted);
            font-size: 16px;
        }
        
        /* ===== 模态框 ===== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: var(--surface);
            border-radius: var(--radius);
            width: 100%;
            max-width: 680px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 48px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-light);
            animation: modalSlide 0.3s ease;
        }
        
        @keyframes modalSlide {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .modal-header {
            margin-bottom: 36px;
        }
        
        .modal-title {
            font-family: var(--font-serif);
            font-size: 32px;
            font-weight: 500;
            margin-bottom: 12px;
        }
        
        .modal-subtitle {
            color: var(--text-muted);
            font-size: 16px;
            line-height: 1.6;
        }
        
        /* ===== 表单 ===== */
        .form-group {
            margin-bottom: 32px;
        }
        
        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-soft);
            margin-bottom: 12px;
            letter-spacing: 0.3px;
        }
        
        input, textarea {
            width: 100%;
            padding: 14px 0;
            border: none;
            border-bottom: 2px solid var(--border-light);
            font-size: 16px;
            font-family: var(--font-sans);
            color: var(--text);
            background: transparent;
            transition: border-color 0.2s;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-bottom-color: var(--accent);
        }
        
        textarea {
            min-height: 350px;
            resize: vertical;
            font-family: 'JetBrains Mono', monospace;
            font-size: 15px;
            line-height: 1.8;
        }
        
        .form-actions {
            display: flex;
            gap: 16px;
            margin-top: 40px;
            padding-top: 32px;
            border-top: 1px solid var(--border-light);
        }
        
        /* ===== 按钮 ===== */
        .btn {
            padding: 14px 28px;
            border: 1px solid var(--border-light);
            background: var(--surface);
            color: var(--text);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 40px;
            transition: var(--transition);
            font-family: var(--font-sans);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn:hover {
            background: var(--selection);
            border-color: var(--border);
            transform: translateY(-1px);
        }
        
        .btn-primary {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        
        .btn-primary:hover {
            background: var(--accent-dark);
            border-color: var(--accent-dark);
        }
        
        .btn-danger {
            border-color: #ff6b6b;
            color: #ff6b6b;
        }
        
        .btn-danger:hover {
            background: #ff6b6b;
            color: white;
        }
        
        /* ===== 返回按钮 ===== */
        .back-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 15px;
            padding: 8px 0;
            margin-bottom: 32px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
            border-radius: 40px;
        }
        
        .back-btn:hover {
            color: var(--accent);
            gap: 12px;
        }
        
        /* ===== 错误提示 ===== */
        .error {
            background: rgba(255, 107, 107, 0.1);
            color: #ff6b6b;
            padding: 16px 20px;
            border-radius: var(--radius-sm);
            margin-bottom: 24px;
            font-size: 14px;
            border: 1px solid rgba(255, 107, 107, 0.2);
        }
        
        /* ===== 加载状态 ===== */
        .loading {
            text-align: center;
            padding: 80px 0;
            color: var(--text-muted);
            font-family: var(--font-serif);
            font-style: italic;
        }
        
        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--border-light);
            border-top-color: var(--accent);
            border-radius: 50%;
            margin-left: 12px;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* ===== 页脚 ===== */
        .site-footer {
            margin-top: auto;
            padding: 40px 0;
            border-top: 1px solid var(--border-light);
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
        }
        
        .footer-content {
            display: flex;
            justify-content: center;
            gap: 24px;
        }
        
        .footer-content a {
            color: var(--text-soft);
            text-decoration: none;
            transition: var(--transition);
        }
        
        .footer-content a:hover {
            color: var(--accent);
        }
        
        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            :root {
                --max-width: 100%;
                --header-height: 70px;
            }
            
            .container {
                padding: 0 20px;
            }
            
            .post-title {
                font-size: 30px;
            }
            
            .post-detail-title {
                font-size: 40px;
            }
            
            .post-detail-content {
                font-size: 17px;
            }
            
            .modal-content {
                padding: 32px 24px;
            }
            
            .modal-title {
                font-size: 28px;
            }
        }
        
        @media (max-width: 480px) {
            .post-title {
                font-size: 26px;
            }
            
            .post-detail-title {
                font-size: 32px;
            }
            
            .nav-links {
                gap: 4px;
            }
            
            .nav-btn {
                padding: 8px 12px;
            }
        }
    </style>
</head>
<body>
    <div class="site-wrapper">
        <header class="site-header">
            <div class="container">
                <nav class="nav">
                    <a href="/" class="logo" id="homeLink">
                        墨言 <span>· 思想碎片</span>
                    </a>
                    <div class="nav-links">
                        <button class="nav-btn" id="loginBtn" onclick="showLoginModal()">
                            <i class="fa-regular fa-user"></i>登录
                        </button>
                        <button class="nav-btn" id="logoutBtn" onclick="logout()" style="display: none;">
                            <i class="fa-regular fa-sign-out"></i>登出
                        </button>
                        <button class="nav-btn primary" id="writeBtn" onclick="showCreateModal()" style="display: none;">
                            <i class="fa-regular fa-pen-to-square"></i>写文章
                        </button>
                    </div>
                </nav>
            </div>
        </header>

        <main id="app" class="container">
            <!-- 动态内容 -->
        </main>

        <footer class="site-footer">
            <div class="container">
                <div class="footer-content">
                    <span>© 2024 墨言博客</span>
                    <a href="#">关于</a>
                    <a href="#">订阅</a>
                </div>
            </div>
        </footer>
    </div>

    <!-- 登录模态框 -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">管理员登录</h2>
                <p class="modal-subtitle">登录后可以发布、编辑和删除文章</p>
            </div>
            <div id="loginError" class="error" style="display: none;"></div>
            <form id="loginForm" onsubmit="login(event)">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="loginUsername" required autocomplete="username" placeholder="输入用户名">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="loginPassword" required autocomplete="current-password" placeholder="输入密码">
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">
                        <i class="fa-regular fa-arrow-right-to-bracket"></i>登录
                    </button>
                    <button type="button" class="btn" onclick="closeLoginModal()">取消</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 编辑文章模态框 -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">写新文章</h2>
                <p class="modal-subtitle">支持 Markdown 格式，尽情书写你的想法</p>
            </div>
            <form id="postForm" onsubmit="savePost(event)">
                <div class="form-group">
                    <label>标题</label>
                    <input type="text" id="postTitle" required placeholder="给你的文章起个标题">
                </div>
                <div class="form-group">
                    <label>内容</label>
                    <textarea id="postContent" required placeholder="用 Markdown 写作..."></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">
                        <i class="fa-regular fa-floppy-disk"></i>保存
                    </button>
                    <button type="button" class="btn" onclick="closeModal()">取消</button>
                    <button type="button" class="btn btn-danger" id="deleteBtn" onclick="deletePost()" style="display:none; margin-left: auto;">
                        <i class="fa-regular fa-trash-can"></i>删除
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 配置 marked 和 highlight.js
        marked.setOptions({
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    try {
                        return hljs.highlight(code, { language: lang }).value;
                    } catch (err) {}
                }
                return hljs.highlightAuto(code).value;
            },
            breaks: true,
            gfm: true
        });

        let currentPostId = null;
        let authToken = localStorage.getItem('authToken');
        let currentView = 'list';

        // 检查登录状态
        function checkAuth() {
            const loginBtn = document.getElementById('loginBtn');
            const logoutBtn = document.getElementById('logoutBtn');
            const writeBtn = document.getElementById('writeBtn');
            
            if (authToken) {
                loginBtn.style.display = 'none';
                logoutBtn.style.display = 'inline-flex';
                writeBtn.style.display = 'inline-flex';
            } else {
                loginBtn.style.display = 'inline-flex';
                logoutBtn.style.display = 'none';
                writeBtn.style.display = 'none';
            }
        }

        // 登录
        async function login(event) {
            event.preventDefault();
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            const errorDiv = document.getElementById('loginError');

            errorDiv.style.display = 'none';
            errorDiv.textContent = '';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (!res.ok) {
                    let errorMsg = '登录失败';
                    try {
                        const errorText = await res.text();
                        if (errorText) errorMsg = errorText;
                    } catch (e) {}
                    errorDiv.textContent = errorMsg;
                    errorDiv.style.display = 'block';
                    return;
                }

                const data = await res.json();
                if (!data.token) {
                    errorDiv.textContent = '登录失败: 服务器未返回token';
                    errorDiv.style.display = 'block';
                    return;
                }

                authToken = data.token;
                localStorage.setItem('authToken', authToken);
                closeLoginModal();
                checkAuth();
                
                if (currentView === 'list') {
                    loadPosts();
                }
            } catch (error) {
                errorDiv.textContent = '登录失败: ' + error.message;
                errorDiv.style.display = 'block';
            }
        }

        // 登出
        async function logout() {
            if (authToken) {
                try {
                    await fetch('/api/logout', {
                        method: 'POST',
                        headers: { 'Authorization': 'Bearer ' + authToken }
                    });
                } catch (e) {}
            }
            authToken = null;
            localStorage.removeItem('authToken');
            checkAuth();
            
            if (currentView === 'list') {
                loadPosts();
            } else {
                showHome();
            }
        }

        // 显示登录模态框
        function showLoginModal() {
            document.getElementById('loginModal').classList.add('active');
            document.getElementById('loginError').style.display = 'none';
            document.getElementById('loginForm').reset();
        }

        // 关闭登录模态框
        function closeLoginModal() {
            document.getElementById('loginModal').classList.remove('active');
        }

        // 显示写文章模态框
        function showCreateModal() {
            if (!authToken) {
                showLoginModal();
                return;
            }
            currentPostId = null;
            document.getElementById('modalTitle').textContent = '写新文章';
            document.getElementById('postTitle').value = '';
            document.getElementById('postContent').value = '';
            document.getElementById('deleteBtn').style.display = 'none';
            document.getElementById('editModal').classList.add('active');
        }

        // 加载文章列表
        async function loadPosts() {
            currentView = 'list';
            const app = document.getElementById('app');
            app.innerHTML = '<div class="loading">加载文章</div>';
            
            try {
                const res = await fetch('/api/posts');
                const posts = await res.json();
                
                if (posts.length === 0) {
                    app.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon"><i class="fa-regular fa-pen-to-square"></i></div>
                            <h2>还没有文章</h2>
                            <p>${authToken ? '点击右上角"写文章"开始你的创作' : '登录后可以发布文章'}</p>
                        </div>
                    `;
                    return;
                }

                app.innerHTML = `
                    <div class="posts-list">
                        ${posts.map(post => {
                            const date = new Date(post.created_at);
                            const dateStr = date.toLocaleDateString('zh-CN', { 
                                year: 'numeric', 
                                month: 'long', 
                                day: 'numeric' 
                            });
                            const excerpt = post.content.substring(0, 200).replace(/\n/g, ' ');
                            
                            return `
                                <article class="post-item" onclick="viewPost('${post.id}')">
                                    <div class="post-meta">
                                        <span class="post-date"><i class="fa-regular fa-calendar"></i>${dateStr}</span>
                                    </div>
                                    <h2 class="post-title">${escapeHtml(post.title)}</h2>
                                    <div class="post-excerpt">${escapeHtml(excerpt)}${post.content.length > 200 ? '...' : ''}</div>
                                    <div class="post-footer">
                                        <span class="read-more">
                                            阅读全文 <i class="fa-regular fa-arrow-right"></i>
                                        </span>
                                    </div>
                                </article>
                            `;
                        }).join('')}
                    </div>
                `;
            } catch (error) {
                app.innerHTML = `<div class="error">加载失败: ${error.message}</div>`;
            }
        }

        // 查看单篇文章
        async function viewPost(id) {
            currentView = 'post';
            const app = document.getElementById('app');
            app.innerHTML = '<div class="loading">加载文章</div>';
            
            try {
                const res = await fetch(`/api/posts/${id}`);
                const post = await res.json();
                
                const date = new Date(post.created_at);
                const dateStr = date.toLocaleDateString('zh-CN', { 
                    year: 'numeric', 
                    month: 'long', 
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                const html = marked.parse(post.content);

                app.innerHTML = `
                    <div class="post-detail">
                        <button class="back-btn" onclick="loadPosts()">
                            <i class="fa-regular fa-arrow-left"></i> 返回列表
                        </button>
                        <article>
                            <header class="post-detail-header">
                                <h1 class="post-detail-title">${escapeHtml(post.title)}</h1>
                                <div class="post-detail-meta">
                                    <span><i class="fa-regular fa-calendar"></i>${dateStr}</span>
                                    ${authToken ? `
                                        <button class="nav-btn" onclick="editPost('${post.id}')">
                                            <i class="fa-regular fa-pen-to-square"></i> 编辑
                                        </button>
                                    ` : ''}
                                </div>
                            </header>
                            <div class="post-detail-content">
                                ${html}
                            </div>
                        </article>
                    </div>
                `;

                // 代码高亮
                document.querySelectorAll('pre code').forEach(block => {
                    hljs.highlightElement(block);
                });

            } catch (error) {
                app.innerHTML = `<div class="error">加载失败: ${error.message}</div>`;
            }
        }

        // 编辑文章
        function editPost(id) {
            if (!authToken) {
                showLoginModal();
                return;
            }
            viewPostForEdit(id);
        }

        // 加载文章到编辑框
        async function viewPostForEdit(id) {
            try {
                const res = await fetch(`/api/posts/${id}`);
                const post = await res.json();
                currentPostId = post.id;
                document.getElementById('modalTitle').textContent = '编辑文章';
                document.getElementById('postTitle').value = post.title;
                document.getElementById('postContent').value = post.content;
                document.getElementById('deleteBtn').style.display = 'inline-flex';
                document.getElementById('editModal').classList.add('active');
            } catch (error) {
                alert('加载失败: ' + error.message);
            }
        }

        // 保存文章
        async function savePost(event) {
            event.preventDefault();
            if (!authToken) {
                showLoginModal();
                return;
            }

            const title = document.getElementById('postTitle').value;
            const content = document.getElementById('postContent').value;

            try {
                const url = currentPostId ? `/api/posts/${currentPostId}` : '/api/posts';
                const method = currentPostId ? 'PUT' : 'POST';
                
                const res = await fetch(url, {
                    method: method,
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + authToken
                    },
                    body: JSON.stringify({ title, content })
                });

                if (!res.ok) {
                    if (res.status === 401) {
                        logout();
                        showLoginModal();
                        return;
                    }
                    throw new Error('保存失败');
                }
                
                closeModal();
                
                if (currentPostId) {
                    viewPost(currentPostId);
                } else {
                    loadPosts();
                }
            } catch (error) {
                alert('保存失败: ' + error.message);
            }
        }

        // 删除文章
        async function deletePost() {
            if (!authToken) return;
            if (!confirm('确定要删除这篇文章吗？')) return;
            
            try {
                const res = await fetch(`/api/posts/${currentPostId}`, { 
                    method: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + authToken }
                });
                if (!res.ok) {
                    if (res.status === 401) {
                        logout();
                        showLoginModal();
                        return;
                    }
                    throw new Error('删除失败');
                }
                closeModal();
                loadPosts();
            } catch (error) {
                alert('删除失败: ' + error.message);
            }
        }

        // 返回首页
        function showHome() {
            loadPosts();
        }

        // 关闭模态框
        function closeModal() {
            document.getElementById('editModal').classList.remove('active');
        }

        // HTML转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
