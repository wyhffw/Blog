<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>墨言 · 思想笔记</title>
    
    <!-- 字体和图标 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Markdown 渲染库 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- 代码高亮 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    
    <style>
        /* ===== 设计变量 ===== */
        :root {
            --bg: #faf8f5;
            --surface: #ffffff;
            --text: #2c2c2c;
            --text-soft: #4f4f4f;
            --text-muted: #787878;
            --border-light: #e8e0d5;
            --border: #d4c9bc;
            --accent: #b45f4b;
            --accent-light: #f5e8e4;
            --accent-dark: #904c3b;
            --selection: #f0e9e2;
            
            --font-sans: 'Inter', -apple-system, sans-serif;
            --font-serif: 'Lora', Georgia, serif;
            
            --radius: 20px;
            --radius-sm: 12px;
            --max-width: 780px;
            --header-height: 80px;
            
            --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.03);
            --shadow: 0 15px 35px -20px rgba(0, 0, 0, 0.1);
            --transition: all 0.2s ease;
        }
        
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1a1714;
                --surface: #25211e;
                --text: #e8e0d5;
                --text-soft: #c9bcaf;
                --text-muted: #9f9185;
                --border-light: #3a332d;
                --border: #4f453d;
                --accent: #d68b7a;
                --accent-light: #3d312c;
                --selection: #35302b;
            }
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
        }
        
        .site-wrapper {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 24px;
            width: 100%;
        }
        
        /* 导航栏 */
        .site-header {
            height: var(--header-height);
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border-light);
            background: var(--surface);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        
        .logo {
            font-size: 24px;
            font-weight: 500;
            text-decoration: none;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        
        .logo span {
            font-family: var(--font-serif);
            font-size: 20px;
            color: var(--text-muted);
            font-style: italic;
        }
        
        .nav-links {
            display: flex;
            gap: 8px;
        }
        
        .nav-btn {
            background: none;
            border: none;
            color: var(--text-soft);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 40px;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        
        .nav-btn:hover {
            background: var(--selection);
            color: var(--text);
        }
        
        .nav-btn.primary {
            background: var(--accent);
            color: white;
        }
        
        .nav-btn.primary:hover {
            background: var(--accent-dark);
        }
        
        /* 文章列表 */
        .posts-list {
            padding: 48px 0;
        }
        
        .post-item {
            cursor: pointer;
            padding: 40px 0;
            border-bottom: 1px solid var(--border-light);
            transition: var(--transition);
        }
        
        .post-item:first-child {
            padding-top: 0;
        }
        
        .post-item:last-child {
            border-bottom: none;
        }
        
        .post-item:hover {
            transform: translateX(8px);
        }
        
        .post-date {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.5px;
        }
        
        .post-title {
            font-family: var(--font-serif);
            font-size: 36px;
            font-weight: 500;
            line-height: 1.2;
            margin-bottom: 16px;
            color: var(--text);
        }
        
        .post-excerpt {
            color: var(--text-soft);
            font-size: 17px;
            margin-bottom: 20px;
            font-family: var(--font-serif);
        }
        
        .read-more {
            color: var(--accent);
            font-size: 15px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        /* 文章详情 */
        .post-detail {
            padding: 48px 0;
        }
        
        .back-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 15px;
            margin-bottom: 32px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
        }
        
        .back-btn:hover {
            color: var(--accent);
            gap: 12px;
        }
        
        .post-detail-header {
            margin-bottom: 40px;
        }
        
        .post-detail-title {
            font-family: var(--font-serif);
            font-size: 48px;
            font-weight: 500;
            line-height: 1.1;
            margin: 16px 0 24px;
        }
        
        .post-detail-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-muted);
            font-size: 14px;
            padding: 20px 0;
            border-top: 1px solid var(--border-light);
            border-bottom: 1px solid var(--border-light);
        }
        
        .post-detail-content {
            font-size: 18px;
            line-height: 1.9;
            color: var(--text);
            margin-top: 48px;
            font-family: var(--font-serif);
        }
        
        /* Markdown 样式 */
        .post-detail-content h1,
        .post-detail-content h2,
        .post-detail-content h3 {
            font-family: var(--font-sans);
            margin: 1.8em 0 1em;
        }
        
        .post-detail-content p {
            margin-bottom: 1.8em;
        }
        
        .post-detail-content code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9em;
            background: var(--selection);
            padding: 0.2em 0.4em;
            border-radius: 4px;
        }
        
        .post-detail-content pre {
            background: var(--surface);
            border: 1px solid var(--border-light);
            border-radius: var(--radius);
            padding: 20px;
            overflow-x: auto;
            margin: 32px 0;
        }
        
        .post-detail-content blockquote {
            margin: 40px 0;
            padding: 20px 28px;
            border-left: 4px solid var(--accent);
            background: var(--selection);
            border-radius: 0 var(--radius) var(--radius) 0;
            font-style: italic;
        }
        
        /* 模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: var(--surface);
            border-radius: var(--radius);
            width: 100%;
            max-width: 700px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 40px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-light);
        }
        
        .modal-title {
            font-family: var(--font-serif);
            font-size: 32px;
            font-weight: 500;
            margin-bottom: 12px;
        }
        
        .modal-subtitle {
            color: var(--text-muted);
            margin-bottom: 32px;
        }
        
        /* 表单 */
        .form-group {
            margin-bottom: 28px;
        }
        
        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-soft);
            margin-bottom: 8px;
        }
        
        input, textarea {
            width: 100%;
            padding: 12px 0;
            border: none;
            border-bottom: 2px solid var(--border-light);
            background: transparent;
            color: var(--text);
            font-size: 16px;
            transition: border-color 0.2s;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-bottom-color: var(--accent);
        }
        
        textarea {
            min-height: 300px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 15px;
            resize: vertical;
        }
        
        .form-actions {
            display: flex;
            gap: 16px;
            margin-top: 32px;
            padding-top: 28px;
            border-top: 1px solid var(--border-light);
        }
        
        .btn {
            padding: 12px 24px;
            border: 1px solid var(--border-light);
            background: var(--surface);
            color: var(--text);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 40px;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn:hover {
            background: var(--selection);
        }
        
        .btn-primary {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        
        .btn-primary:hover {
            background: var(--accent-dark);
        }
        
        .btn-danger {
            border-color: #ff6b6b;
            color: #ff6b6b;
        }
        
        .btn-danger:hover {
            background: #ff6b6b;
            color: white;
        }
        
        /* 提示消息 */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--surface);
            color: var(--text);
            padding: 12px 24px;
            border-radius: 50px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-light);
            font-size: 14px;
            z-index: 2000;
            animation: slideUp 0.3s ease;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translate(-50%, 20px);
            }
            to {
                opacity: 1;
                transform: translate(-50%, 0);
            }
        }
        
        .error-message {
            color: #ff6b6b;
            font-size: 14px;
            margin-top: 8px;
        }
        
        .loading {
            text-align: center;
            padding: 60px 0;
            color: var(--text-muted);
        }
        
        .empty-state {
            text-align: center;
            padding: 80px 0;
            color: var(--text-muted);
        }
        
        .empty-icon {
            font-size: 64px;
            margin-bottom: 24px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="site-wrapper">
        <header class="site-header">
            <div class="container">
                <nav class="nav">
                    <div class="logo" id="homeBtn">
                        墨言 <span>· 思想笔记</span>
                    </div>
                    <div class="nav-links">
                        <button class="nav-btn" id="loginBtn" onclick="showLoginModal()">
                            <i class="fa-regular fa-user"></i>登录
                        </button>
                        <button class="nav-btn" id="logoutBtn" onclick="handleLogout()" style="display: none;">
                            <i class="fa-regular fa-sign-out"></i>登出
                        </button>
                        <button class="nav-btn primary" id="writeBtn" onclick="showCreateModal()" style="display: none;">
                            <i class="fa-regular fa-pen-to-square"></i>写文章
                        </button>
                    </div>
                </nav>
            </div>
        </header>

        <main id="mainContent" class="container">
            <!-- 动态内容 -->
        </main>
    </div>

    <!-- 登录模态框 -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <h2 class="modal-title">登录</h2>
            <div class="modal-subtitle">使用管理员账号登录后可以管理文章</div>
            <div id="loginError" class="error-message"></div>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="password" required>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">
                        <i class="fa-regular fa-arrow-right-to-bracket"></i>登录
                    </button>
                    <button type="button" class="btn" onclick="closeLoginModal()">取消</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 文章编辑模态框 -->
    <div id="postModal" class="modal">
        <div class="modal-content">
            <h2 class="modal-title" id="modalTitle">写新文章</h2>
            <div class="modal-subtitle">支持 Markdown 格式</div>
            <form onsubmit="handleSavePost(event)">
                <div class="form-group">
                    <label>标题</label>
                    <input type="text" id="postTitle" required>
                </div>
                <div class="form-group">
                    <label>内容</label>
                    <textarea id="postContent" required rows="12"></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">
                        <i class="fa-regular fa-floppy-disk"></i>保存
                    </button>
                    <button type="button" class="btn" onclick="closePostModal()">取消</button>
                    <button type="button" class="btn btn-danger" id="deleteBtn" onclick="handleDeletePost()" style="display: none; margin-left: auto;">
                        <i class="fa-regular fa-trash-can"></i>删除
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 配置 marked
        marked.setOptions({
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    try {
                        return hljs.highlight(code, { language: lang }).value;
                    } catch (err) {}
                }
                return hljs.highlightAuto(code).value;
            },
            breaks: true,
            gfm: true
        });

        // 状态管理
        let authToken = localStorage.getItem('authToken');
        let currentPostId = null;

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            loadPosts();
            
            // 首页按钮
            document.getElementById('homeBtn').addEventListener('click', () => {
                loadPosts();
            });
        });

        // 检查登录状态
        function checkAuth() {
            const loginBtn = document.getElementById('loginBtn');
            const logoutBtn = document.getElementById('logoutBtn');
            const writeBtn = document.getElementById('writeBtn');
            
            if (authToken) {
                loginBtn.style.display = 'none';
                logoutBtn.style.display = 'inline-flex';
                writeBtn.style.display = 'inline-flex';
            } else {
                loginBtn.style.display = 'inline-flex';
                logoutBtn.style.display = 'none';
                writeBtn.style.display = 'none';
            }
        }

        // 显示提示
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        // API 调用
        async function apiCall(url, options = {}) {
            const headers = {
                'Content-Type': 'application/json',
                ...options.headers
            };
            
            if (authToken) {
                headers['Authorization'] = 'Bearer ' + authToken;
            }
            
            const response = await fetch(url, {
                ...options,
                headers
            });
            
            if (response.status === 401) {
                // token 失效，清除登录状态
                authToken = null;
                localStorage.removeItem('authToken');
                checkAuth();
                showToast('登录已过期，请重新登录');
                throw new Error('unauthorized');
            }
            
            return response;
        }

        // 登录
        async function handleLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('loginError');
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                if (!response.ok) {
                    const error = await response.text();
                    throw new Error(error || '登录失败');
                }
                
                const data = await response.json();
                authToken = data.token;
                localStorage.setItem('authToken', authToken);
                
                closeLoginModal();
                checkAuth();
                loadPosts();
                showToast('登录成功');
                
            } catch (error) {
                errorDiv.textContent = error.message;
            }
        }

        // 登出
        async function handleLogout() {
            try {
                await apiCall('/api/logout', { method: 'POST' });
            } catch (error) {
                // 忽略错误
            }
            
            authToken = null;
            localStorage.removeItem('authToken');
            checkAuth();
            loadPosts();
            showToast('已登出');
        }

        // 加载文章列表
        async function loadPosts() {
            const main = document.getElementById('mainContent');
            main.innerHTML = '<div class="loading">加载文章...</div>';
            
            try {
                const response = await fetch('/api/posts');
                const posts = await response.json();
                
                if (posts.length === 0) {
                    main.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon"><i class="fa-regular fa-pen-to-square"></i></div>
                            <h3>还没有文章</h3>
                            <p>${authToken ? '点击"写文章"开始创作' : '登录后可以发布文章'}</p>
                        </div>
                    `;
                    return;
                }
                
                main.innerHTML = `
                    <div class="posts-list">
                        ${posts.map(post => `
                            <article class="post-item" onclick="viewPost('${post.id}')">
                                <div class="post-date">
                                    <i class="fa-regular fa-calendar"></i>
                                    ${new Date(post.created_at).toLocaleDateString('zh-CN', { 
                                        year: 'numeric', 
                                        month: 'long', 
                                        day: 'numeric' 
                                    })}
                                </div>
                                <h2 class="post-title">${escapeHtml(post.title)}</h2>
                                <div class="post-excerpt">
                                    ${escapeHtml(post.content.substring(0, 200))}${post.content.length > 200 ? '...' : ''}
                                </div>
                                <div class="read-more">
                                    阅读全文 <i class="fa-regular fa-arrow-right"></i>
                                </div>
                            </article>
                        `).join('')}
                    </div>
                `;
            } catch (error) {
                main.innerHTML = '<div class="error-message">加载失败，请稍后重试</div>';
            }
        }

        // 查看单篇文章
        async function viewPost(id) {
            const main = document.getElementById('mainContent');
            main.innerHTML = '<div class="loading">加载文章...</div>';
            
            try {
                const response = await fetch(`/api/posts/${id}`);
                const post = await response.json();
                
                const html = marked.parse(post.content);
                
                main.innerHTML = `
                    <div class="post-detail">
                        <button class="back-btn" onclick="loadPosts()">
                            <i class="fa-regular fa-arrow-left"></i> 返回列表
                        </button>
                        <article>
                            <header class="post-detail-header">
                                <h1 class="post-detail-title">${escapeHtml(post.title)}</h1>
                                <div class="post-detail-meta">
                                    <span>
                                        <i class="fa-regular fa-calendar"></i>
                                        ${new Date(post.created_at).toLocaleDateString('zh-CN', {
                                            year: 'numeric',
                                            month: 'long',
                                            day: 'numeric',
                                            hour: '2-digit',
                                            minute: '2-digit'
                                        })}
                                    </span>
                                    ${authToken ? `
                                        <button class="nav-btn" onclick="editPost('${post.id}')">
                                            <i class="fa-regular fa-pen-to-square"></i> 编辑
                                        </button>
                                    ` : ''}
                                </div>
                            </header>
                            <div class="post-detail-content">
                                ${html}
                            </div>
                        </article>
                    </div>
                `;
                
                // 代码高亮
                document.querySelectorAll('pre code').forEach(block => {
                    hljs.highlightElement(block);
                });
                
            } catch (error) {
                main.innerHTML = '<div class="error-message">加载失败，请稍后重试</div>';
            }
        }

        // 编辑文章
        function editPost(id) {
            if (!authToken) {
                showLoginModal();
                return;
            }
            
            fetch(`/api/posts/${id}`)
                .then(res => res.json())
                .then(post => {
                    currentPostId = post.id;
                    document.getElementById('modalTitle').textContent = '编辑文章';
                    document.getElementById('postTitle').value = post.title;
                    document.getElementById('postContent').value = post.content;
                    document.getElementById('deleteBtn').style.display = 'inline-flex';
                    document.getElementById('postModal').classList.add('active');
                })
                .catch(() => showToast('加载失败'));
        }

        // 显示创建文章模态框
        function showCreateModal() {
            if (!authToken) {
                showLoginModal();
                return;
            }
            currentPostId = null;
            document.getElementById('modalTitle').textContent = '写新文章';
            document.getElementById('postTitle').value = '';
            document.getElementById('postContent').value = '';
            document.getElementById('deleteBtn').style.display = 'none';
            document.getElementById('postModal').classList.add('active');
        }

        // 保存文章
        async function handleSavePost(event) {
            event.preventDefault();
            
            if (!authToken) {
                showLoginModal();
                return;
            }
            
            const title = document.getElementById('postTitle').value;
            const content = document.getElementById('postContent').value;
            
            try {
                let response;
                if (currentPostId) {
                    // 更新
                    response = await apiCall(`/api/posts/${currentPostId}`, {
                        method: 'PUT',
                        body: JSON.stringify({ title, content })
                    });
                } else {
                    // 创建
                    response = await apiCall('/api/posts', {
                        method: 'POST',
                        body: JSON.stringify({ title, content })
                    });
                }
                
                if (!response.ok) throw new Error('保存失败');
                
                const post = await response.json();
                closePostModal();
                
                if (currentPostId) {
                    viewPost(post.id);
                } else {
                    loadPosts();
                }
                
                showToast(currentPostId ? '更新成功' : '发布成功');
                
            } catch (error) {
                showToast('保存失败');
            }
        }

        // 删除文章
        async function handleDeletePost() {
            if (!currentPostId || !confirm('确定要删除这篇文章吗？')) return;
            
            try {
                const response = await apiCall(`/api/posts/${currentPostId}`, {
                    method: 'DELETE'
                });
                
                if (!response.ok) throw new Error('删除失败');
                
                closePostModal();
                loadPosts();
                showToast('删除成功');
                
            } catch (error) {
                showToast('删除失败');
            }
        }

        // 模态框控制
        function showLoginModal() {
            document.getElementById('loginModal').classList.add('active');
            document.getElementById('loginError').textContent = '';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        function closeLoginModal() {
            document.getElementById('loginModal').classList.remove('active');
        }

        function closePostModal() {
            document.getElementById('postModal').classList.remove('active');
        }

        // 工具函数
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 点击模态框背景关闭
        document.getElementById('loginModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeLoginModal();
        });
        
        document.getElementById('postModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closePostModal();
        });
    </script>
</body>
</html>
